[project]
name = "vsparse"
version = "0.3.0"
description = "Value-Compressed Sparse Column/Row (VCSC/VCSR) arrays, with optional AnnData integration"
readme = "README.md"
authors = [
    { name = "Aaron Meyer", email = "git@ameyer.me" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["anndata", "single-cell", "sparse", "compression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "numba>=0.60",
    "anndata>=0.13",
    "hdf5plugin>=4.0",
]

[project.urls]
Homepage = "https://meyer-lab.github.io/vsparse/"
Repository = "https://github.com/meyer-lab/vsparse"
Documentation = "https://meyer-lab.github.io/vsparse/"
Issues = "https://github.com/meyer-lab/vsparse/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=3.0",
    "sphinx-autodoc-typehints>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "codespell>=2.3",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "NPY", "PD", "SIM", "RET", "PIE", "ERA", "PERF", "UP", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vsparse"]

[tool.codespell]
skip = "*.lock,uv.lock,.venv,docs/_build,benchmarks/baselines.json"
ignore-words-list = "coo"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/vsparse"]
